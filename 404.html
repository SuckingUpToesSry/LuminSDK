<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — LuminSDK</title>
  <meta name="description" content="Essa página não existe no LuminSDK. Volte para a biblioteca de jogos.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07070c">
  <link rel="icon" href="/LuminSDK/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/LuminSDK/assets/css/styles.css?v=12">
  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      text-align: center;
    }
    .notfound__code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 20vw, 11rem);
      font-weight: 700;
      line-height: .9;
      letter-spacing: -.05em;
      background: linear-gradient(120deg, var(--violet), var(--indigo) 45%, var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .notfound p { max-width: 460px; margin: 18px auto 0; color: var(--muted); }
    .notfound__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <span class="bg-fx__blob bg-fx__blob--violet"></span>
    <span class="bg-fx__blob bg-fx__blob--cyan"></span>
    <span class="bg-fx__grid"></span>
  </div>

  <main class="notfound">
    <div>
      <img src="/LuminSDK/assets/img/favicon.svg" alt="" width="56" height="56" style="margin: 0 auto 22px; border-radius: 16px;">
      <p class="notfound__code">404</p>
      <h1 style="margin-top: 10px; font-size: clamp(1.4rem, 3vw, 1.9rem);">Essa página saiu do mapa</h1>
      <p>O link pode estar quebrado ou o jogo foi movido. A biblioteca continua lá — com mais de 1.100 jogos esperando por você.</p>
      <div class="notfound__actions">
        <a class="btn btn--primary" href="/LuminSDK/#biblioteca">Ir para os jogos</a>
        <a class="btn btn--soft" href="/LuminSDK/">Voltar ao início</a>
        <a class="btn btn--soft" href="https://github.com/SuckingUpToesSry/LuminSDK/issues">Reportar um link quebrado</a>
      </div>
    </div>
  </main>

  <script src="/LuminSDK/assets/js/site.js?v=12" defer></script>
</body>
</html>
